[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = -v --html=reports/report.html --self-contained-html
markers =
    auth: Authentication tests
    profile: Profile and vehicle tests
    slots: Parking lot and slot tests
    booking: Pre-booking tests
    qr: QR code entry and exit tests
    charges: Parking charges tests
    history: Booking and payment history tests
    incident: Incident reporting tests
    admin: Admin management tests
    analytics: Analytics and reports tests
    not_implemented: Marks tests for features known to be missing in current SPMS

